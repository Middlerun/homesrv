name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The documented minimum, and a current release.
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer install --no-interaction --no-progress
      - name: Lint
        run: find src public bin -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Kobo dashboard UI trees
        run: bin/test-ui
